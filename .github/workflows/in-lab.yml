name: Scrape lab calendar

# Pulls the public lab Google Calendar and publishes the next week's
# "in lab" events to in-lab.json on the calendar-data branch, along with
# claude.json (the last month of Claude Code commits across lab repos),
# github.json (the last week of commits to RobertsLab repos) and
# ttn-gateway.json (the TTN gateway's console stats, read with the TTN_API_KEY secret).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/in_lab.py, scripts/claude_activity.py, scripts/github_activity.py, scripts/ttn_gateway.py, .github/workflows/in-lab.yml]

permissions:
  contents: write

concurrency:
  group: in-lab
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring_ical_events
      - run: mkdir -p out && python scripts/in_lab.py out/in-lab.json
      - run: python scripts/claude_activity.py out/claude.json
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/github_activity.py out/github.json
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/ttn_gateway.py out/ttn-gateway.json
        continue-on-error: true
        env:
          TTN_API_KEY: ${{ secrets.TTN_API_KEY }}
      - name: Publish to calendar-data branch
        working-directory: out
        run: |
          git init -q -b calendar-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Update lab-status data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" calendar-data
